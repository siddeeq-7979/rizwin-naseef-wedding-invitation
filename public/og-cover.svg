<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="backdrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFD1CA" />
      <stop offset="50%" stop-color="#BFC1BA" />
      <stop offset="100%" stop-color="#ACAFA7" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FAF8F3" />
      <stop offset="70%" stop-color="#F1EEE6" />
      <stop offset="100%" stop-color="#E7E2D8" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C99B" />
      <stop offset="50%" stop-color="#B68F66" />
      <stop offset="100%" stop-color="#8C6740" />
    </linearGradient>
    <pattern id="chevron" width="24" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 10 L12 2 L24 10" fill="none" stroke="#4A4246" stroke-width="2" />
      <path d="M0 14 L12 6 L24 14" fill="none" stroke="#9E9289" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Sage-Stone Backdrop -->
  <rect width="1200" height="630" fill="url(#backdrop)" />

  <!-- Outer Card Frame -->
  <rect x="84" y="46" width="1032" height="538" rx="18" fill="url(#cardGlow)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <rect x="102" y="64" width="996" height="502" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.55" />

  <!-- Top & Bottom Chevron Trim -->
  <rect x="104" y="66" width="992" height="14" fill="url(#chevron)" opacity="0.85" />
  <rect x="104" y="550" width="992" height="14" fill="url(#chevron)" opacity="0.85" />

  <!-- Arabic Bismillah -->
  <text x="600" y="138" text-anchor="middle" fill="#8C6740" font-family="'Amiri', 'Traditional Arabic', Georgia, serif" font-size="30" direction="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>

  <!-- Interlocked Gold Wedding Rings -->
  <g transform="translate(600, 198)">
    <circle cx="-18" cy="0" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="4.2" />
    <circle cx="18" cy="0" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="3.8" />
    <polygon points="18,-31 24,-25 18,-19 12,-25" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- Upper Label -->
  <text x="600" y="264" text-anchor="middle" fill="#6E6568" font-family="'Jost', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="7">WEDDING INVITATION</text>

  <!-- Gold Accent Line Top -->
  <line x1="340" y1="292" x2="860" y2="292" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />

  <!-- Couple Names -->
  <text x="600" y="362" text-anchor="middle" fill="#4A4246" font-family="'Cormorant Garamond', Georgia, serif" font-size="64" font-weight="700" letter-spacing="5">RIZWIN &amp; NASEEF</text>

  <!-- Gold Accent Line Bottom -->
  <line x1="340" y1="390" x2="860" y2="390" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />

  <!-- Subtitle -->
  <text x="600" y="436" text-anchor="middle" fill="#332D30" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="27">Rizwin Rukiya T.K &amp; Naseef Ashraf A.P</text>

  <!-- Date & Celebrations -->
  <text x="600" y="484" text-anchor="middle" fill="#8C6740" font-family="'Jost', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4.5">1 – 3 JANUARY 2027 · KERALA</text>

  <!-- Blessing Line -->
  <text x="600" y="524" text-anchor="middle" fill="#6E6568" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="22">Two hearts. Two families. Becoming one, in shaa Allah</text>
</svg>
